[package]
name = "tuwuh"
version = "0.1.0"
edition = "2021"

[lib]
name = "tuwuh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
keyring = "4.2.0"
libc = "0.2"
mime_guess = "2.0.5"
notify = "8.2.0"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "io-util"] }
trash = "5.2.7"

[build-dependencies]
tauri-build = "2.6.3"
